# 鸿蒙展厅讲解内容 - 中文
# 每个点位包含：简介、详细讲解、表情、手势

content:
  point_01:
    intro: "欢迎来到深圳技术大学鸿蒙展厅。我是你的智能讲解员灵犀，接下来由我带领大家了解华为鸿蒙操作系统的创新技术。"
    detail: "鸿蒙操作系统是华为自主研发的面向万物互联时代的全场景分布式操作系统。它打破了传统操作系统的边界，实现了多设备协同、资源共享的革命性突破。"
    emotion: "greeting"        # 表情：问候
    gesture: "wave"            # 手势：挥手
    duration: 15               # 讲解时长（秒）
    
  point_02:
    intro: "现在我们来到鸿蒙系统概览区。"
    detail: "鸿蒙系统采用分层解耦的架构设计，从下至上分为内核层、系统服务层、框架层和应用层。其核心特性包括一次开发、多端部署，跨设备的统一生态，以及强大的分布式能力。鸿蒙不仅支持手机、平板，还可以运行在智能手表、车机、智慧屏等各类设备上。"
    emotion: "happy"
    gesture: "explain"
    duration: 30
    
  point_03:
    intro: "这里展示的是鸿蒙系统的核心技术——分布式软总线。"
    detail: "分布式软总线是鸿蒙系统的'神经中枢'。它通过统一的通信框架，让不同设备之间能够像零件一样自由组合。无论是蓝牙、Wi-Fi还是有线连接，软总线都能自动选择最优通信方式，实现设备间的无感连接。比如，您可以在手机上编辑文档，一键流转到平板继续工作，或者将手机正在播放的视频无缝投到智慧屏上。"
    emotion: "thinking"
    gesture: "point"
    duration: 25
    
  point_04:
    intro: "接下来我们看看鸿蒙的应用生态。"
    detail: "鸿蒙生态正在快速发展。目前已有超过5000款应用原生支持鸿蒙系统，涵盖社交、购物、出行、教育等各个领域。开发者使用方舟开发框架ArkTS，一套代码就能适配手机、平板、手表等多种设备，大大降低了开发成本。这种'一次开发，多端部署'的能力，让鸿蒙生态快速壮大。"
    emotion: "happy"
    gesture: "welcome"
    duration: 20
    
  point_05:
    intro: "这里是互动体验区，大家可以亲身感受鸿蒙的分布式能力。"
    detail: "请看这个演示：当我手中的手机靠近这台平板时，两者会自动识别并建立连接。现在我在手机上打开一个视频，轻轻一拉，视频就流转到了平板的大屏幕上。同时，音频也可以切换到旁边的智能音箱播放。这就是鸿蒙的'超级终端'能力——让多个设备组成一个虚拟的超级设备，共享硬件资源。"
    emotion: "surprised"
    gesture: "point"
    duration: 30
    
  point_06:
    intro: "最后，让我们展望一下鸿蒙的未来。"
    detail: "鸿蒙系统的愿景是构建万物互联的智能世界。未来，鸿蒙将在更多场景落地：智能家居中，所有设备通过鸿蒙协同工作；智能出行中，车机、手机、智能手表无缝协作；工业领域，鸿蒙也将赋能智能制造。华为预计到2030年，将有超过10亿台设备搭载鸿蒙系统，真正实现万物互联的美好愿景。"
    emotion: "thinking"
    gesture: "explain"
    duration: 20
    
  point_07:
    intro: "今天的参观到这里就结束了。"
    detail: "感谢大家的参观！如果您对鸿蒙系统还有任何疑问，欢迎随时向工作人员咨询。深圳技术大学欢迎您再次光临！"
    emotion: "greeting"
    gesture: "wave"
    duration: 10

