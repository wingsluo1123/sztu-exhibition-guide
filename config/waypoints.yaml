# 展厅讲解点位配置
# 坐标系：SLAM 地图坐标系（单位：米）
#
# 坐标由 tools/pick_waypoints.py 从实测地图上选出并校验：
#   净空 ≥ 机器人半径、只在走过的区域内、相邻两点直线畅通。
# **不要手工改坐标**，改完请重跑那个工具重新校验 —— 现在没有
# 避障，一个没校验过的点位就是一次撞墙。
#
# ── 这一版是什么、不是什么（2026-09-30，maps/testroom）────────────────
#
# 这是**测试房间**的图，只有 2 个点，目的是把「位姿→导航→到点→讲解」
# 整条链实走一遍验通。展厅的点位要等展厅那趟图，不要拿这两个点当演示。
#
# 点位不是手选的，是从建图那趟的**实测停留点**里取的（站住 ≥ 3 s 的地方），
# 所以朝向是当时人真的面对展品的朝向 —— 这是地图给不出来的东西。
# 位置被工具往最近的达标处挪过（point_01 挪 0.05 m，point_02 挪 1.14 m），
# 挪的是位置，朝向原样保留。
#
# 为什么只有 2 个点：第三个停留点在那个杂物岛的另一侧。量出来这房间
# 1↔3 的最宽通路 0.75 m、2↔3 是 0.70 m —— **过得去**（只要 0.40 m），
# 但中转点**站不住**（要 0.95 m = 半径 0.40 + 到点容差 0.30 + 滑行 0.25）。
# 中间点也是停车点（navigate_to 会阻塞到到达再 stop），所以放不下。
#
# 这两个阈值别混：「过得去」= 0.40，「站得住」= 0.95。混过两次了。
# 其中**滑行 0.25 m 是假设值**（半步），没量过，而它一个人就吃掉了
# 房间能给的（0.70~0.75）和要求的（0.95）之间的全部缺口。要量它得让
# 机器人动，所以得你来。
#
# ⚠ 还有第三个阈值，2026-10-01 才补上：「**按控制律真的走得过去**」。
# 「直线畅通」是不够的 —— 控制律 advance 段边走边拧，走的是弧线，
# point_01→point_02 直线最窄 0.600 m，按控制律在对准容差包络上最差只有
# 0.400 m。为此 max_linear_speed 从 0.5 降到了 0.25，见下面 navigation 块。
#
# ⚠ 开走前必须做的一件事：FAST-LIO 每次开机从 (0,0,0) 重新起算，图的原点
# 就是**建图那趟出发的物理位置和朝向**。出发点没对上，这两个点整体偏移，
# 而且不会有任何报错。地上贴胶带标死出发点和朝向。

exhibition_points:
  # 点位 1: 入口欢迎区
  - id: "point_01"
    name: "入口欢迎区"
    name_en: "Entrance Welcome Area"
    position:
      x: 1.171
      y: 0.100
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: -0.039  # sin(-4.4°/2)
      w: 0.999  # cos(-4.4°/2)
    lecture_duration: 15

  # 点位 2: 鸿蒙系统概览
  - id: "point_02"
    name: "鸿蒙系统概览"
    name_en: "HarmonyOS Overview"
    position:
      x: 7.121
      y: 0.500
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: -0.518  # sin(-62.4°/2)
      w: 0.855  # cos(-62.4°/2)
    lecture_duration: 30

# 讲解词写好了、但这张图上放不下的点位。
# 它们不参与这一趟，但 content_*.yaml 里的讲解词要留着给展厅用。
# 这个名单**不是免检牌**：里面的 id 必须真的有讲解词，而且一旦对应点位
# 上线就要从这儿删掉（有测试盯着这两条）。拼错的 id 照样会被查出来。
pending_points:
  - "point_03"   # 分布式软总线
  - "point_04"   # 智能家居
  - "point_05"   # 互动体验区
  - "point_06"   # 智慧办公
  - "point_07"   # 未来展望

# 导航参数
navigation:
  position_tolerance: 0.3
  angle_tolerance: 0.26
  # 2026-10-01 从 0.5 降到 0.25。**不是保守起见，是算出来必须降。**
  # 控制律不走直线：advance 段 angular = 0.4·heading_error，边走边拧，
  # 横移 ≈ R(1-cos err)、R = max_linear_speed/(0.4·err)。而第二段起步时的
  # heading 误差在 6.6°~23.2° 之间**全部合规**（point_01 的对准容差
  # ±14.9° 叠上"从 point_01 看 point_02 偏 8.3°"）。
  # 在真图上按控制律扫这个包络：
  #     0.5 -> 最差净空 0.400 m（比机器人半径 0.40 还低一点点）
  #     0.4 -> 0.450    0.3 -> 0.500    0.25 -> 0.550
  # 过境门槛 0.535 = 半径 0.400 + 定位漂移 0.085 + 栅格 0.050。
  # 所以 0.25 是最快的能过的那一档，**而且只过了 0.015 m**。
  # 这 0.015 m 不是安全余量，是"这房间本来就太窄"的另一种说法；而且模型
  # 没有跟踪滞后，真机横移只会更大。第二段走的时候手别离开遥控器。
  # 盯着这件事的是 src/sztu_navigation/test/test_route_survives_the_control_law.py。
  max_linear_speed: 0.25
  max_angular_speed: 0.8
  min_turn_speed: 0.7
  navigation_timeout: 120
  stall_timeout: 12.0

# 地图配置。
# origin_x / origin_y / resolution 写的是**选点用的那张图**的真实
# 值。运行时没有代码读它们（只有 map.name 被用到），但
# test_map_matches_waypoints.py 拿它们和 maps/<source>.yaml 对：
# 对不上就是图和点位不同源 —— 那是两个坐标系，实走会整体偏。
# 别拿这个原点去给点位加偏移：上面的坐标和 /slam/lidar_odom 发的
# 位姿本来就在**同一个坐标系**里，加了反而偏。
map:
  name: "testroom"
  origin_x: -16.204
  origin_y: -17.175
  resolution: 0.05
  source: "testroom"
