# 展厅讲解点位配置
# 坐标系：SLAM 地图坐标系（单位：米）
#
# ############################################################################
# #  这里的坐标【作废，不要走】 —— 2026-09-30                                #
# ############################################################################
#
# 它们是在 maps/testroom 的**旧版**上选的，而那张图是在**反着的重力系**里
# 摊平的（`sztu_up` 记成了物理上的"下"）。后果不是"图镜像了"这么轻：
# 地面 RANSAC 在反的系里拟合到的是**天花板**，于是取的那层
# 0.25~1.80 m 是天花板下方那一层 —— 墙都在，**家具一个都没进图**。
#
#   占据格：旧图 2196（1.8%）  vs  修好后 6310（5.1%）
#   净空 ≥ 0.95 m 的地方：旧图 23636 格  vs  修好后 2253 格
#
# 所以旧配置里 3.2~3.8 m 的"净空"是虚的，那几个点实际上贴着家具。
#
# 重力符号的判据已经修好（tools/gridmap.py 的 floor_side，判据从"法向背着
# 点云重心"这个代理量换成了"哪一层平面落在传感器离地的合理高度上"，带合成
# 测试和负对照），maps/testroom 也已经用正确的系重建。
#
# 等重新建图那趟（每个点位站住 10 秒）跑完，用 tools/pick_waypoints.py
# 重新出坐标，替换掉下面这一整块。
#
# 坐标由 tools/pick_waypoints.py 从实测地图上选出并校验：
#   净空 ≥ 机器人半径、只在走过的区域内、相邻两点直线畅通。
# **不要手工改坐标**，改完请重跑那个工具重新校验 —— 现在没有
# 避障，一个没校验过的点位就是一次撞墙。

exhibition_points:
  # 点位 1: 入口欢迎区
  - id: "point_01"
    name: "入口欢迎区"
    name_en: "Entrance Welcome Area"
    position:
      x: 0.004
      y: 0.004
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: -0.001  # sin(-0.1°/2)
      w: 1.000  # cos(-0.1°/2)
    lecture_duration: 15

  # 点位 2: 鸿蒙系统概览
  - id: "point_02"
    name: "鸿蒙系统概览"
    name_en: "HarmonyOS Overview"
    position:
      x: 0.276
      y: -2.647
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.152  # sin(17.5°/2)
      w: 0.988  # cos(17.5°/2)
    lecture_duration: 30

  # 点位 3: 分布式软总线
  - id: "point_03"
    name: "分布式软总线"
    name_en: "Distributed Soft Bus"
    position:
      x: -1.924
      y: -4.197
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: -0.611  # sin(-75.3°/2)
      w: 0.792  # cos(-75.3°/2)
    lecture_duration: 25

  # 点位 4: 应用生态展示
  - id: "point_04"
    name: "应用生态展示"
    name_en: "Application Ecosystem"
    position:
      x: -8.724
      y: -1.747
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 1.000  # sin(180.0°/2)
      w: 0.000  # cos(180.0°/2)
    lecture_duration: 20

  # 点位 5: 互动体验区
  - id: "point_05"
    name: "互动体验区"
    name_en: "Interactive Experience Zone"
    position:
      x: -6.474
      y: -1.997
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: -1.000  # sin(-177.5°/2)
      w: 0.022  # cos(-177.5°/2)
    lecture_duration: 30

  # 点位 6: 未来展望
  - id: "point_06"
    name: "未来展望"
    name_en: "Future Outlook"
    position:
      x: -4.524
      y: -0.747
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.664  # sin(83.2°/2)
      w: 0.748  # cos(83.2°/2)
    lecture_duration: 20

  # 点位 7: 参观结束
  - id: "point_07"
    name: "参观结束"
    name_en: "Tour End"
    position:
      x: -2.074
      y: -1.547
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.086  # sin(9.9°/2)
      w: 0.996  # cos(9.9°/2)
    lecture_duration: 10

# 导航参数
navigation:
  position_tolerance: 0.3
  angle_tolerance: 0.26
  max_linear_speed: 0.5
  max_angular_speed: 0.8
  min_turn_speed: 0.7
  navigation_timeout: 120
  stall_timeout: 12.0

# 地图配置。
# **下面的 origin_x / origin_y / resolution 目前没有任何代码在读**
# （只有 map.name 被用到）。写的是这张图的真实值，不是 0 ——
# 上面那些点位坐标和 /slam/lidar_odom 发的位姿在**同一个坐标系**里，
# 谁都不要再拿这个原点去给点位加偏移，加了就整体偏掉。
map:
  name: "hongmeng_exhibition_hall"
  origin_x: -13.149
  origin_y: -11.022
  resolution: 0.05
  source: "regen"
