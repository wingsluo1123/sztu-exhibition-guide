# 展厅讲解点位配置
# 坐标系：SLAM 地图坐标系（单位：米）

exhibition_points:
  # 点位 1: 入口欢迎区
  - id: "point_01"
    name: "入口欢迎区"
    name_en: "Entrance Welcome Area"
    position:
      x: 0.0
      y: 0.0
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.0
      w: 1.0
    lecture_duration: 15  # 讲解时长（秒）
    
  # 点位 2: 鸿蒙系统概览
  - id: "point_02"
    name: "鸿蒙系统概览"
    name_en: "HarmonyOS Overview"
    position:
      x: 3.0
      y: 1.5
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.383  # sin(45°/2)
      w: 0.924  # cos(45°/2)
    lecture_duration: 30
    
  # 点位 3: 分布式技术
  - id: "point_03"
    name: "分布式软总线"
    name_en: "Distributed Soft Bus"
    position:
      x: 5.0
      y: 3.0
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.707  # sin(90°/2)
      w: 0.707  # cos(90°/2)
    lecture_duration: 25
    
  # 点位 4: 应用生态
  - id: "point_04"
    name: "应用生态展示"
    name_en: "Application Ecosystem"
    position:
      x: 7.0
      y: 2.0
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.924  # sin(135°/2)
      w: 0.383  # cos(135°/2)
    lecture_duration: 20
    
  # 点位 5: 互动体验区
  - id: "point_05"
    name: "互动体验区"
    name_en: "Interactive Experience Zone"
    position:
      x: 6.0
      y: -1.0
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 1.0   # sin(180°/2)
      w: 0.0   # cos(180°/2)
    lecture_duration: 30
    
  # 点位 6: 未来展望
  - id: "point_06"
    name: "未来展望"
    name_en: "Future Outlook"
    position:
      x: 3.0
      y: -2.0
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: -0.707  # sin(-90°/2)
      w: 0.707   # cos(-90°/2)
    lecture_duration: 20
    
  # 点位 7: 返回起点
  - id: "point_07"
    name: "参观结束"
    name_en: "Tour End"
    position:
      x: 0.5
      y: -0.5
      z: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.0
      w: 1.0
    lecture_duration: 10

# 导航参数
navigation:
  position_tolerance: 0.3      # 位置到达容忍度（米）
  angle_tolerance: 0.26        # 角度到达容忍度（弧度，约15度）
  max_linear_speed: 0.5        # 最大线速度（米/秒）
  max_angular_speed: 0.8       # 最大角速度（弧度/秒）
  navigation_timeout: 120      # 单次导航超时（秒）

# 地图配置
map:
  name: "hongmeng_exhibition_hall"  # 地图名称
  origin_x: 0.0                     # 地图原点 X
  origin_y: 0.0                     # 地图原点 Y
  resolution: 0.05                  # 地图分辨率（米/像素）
