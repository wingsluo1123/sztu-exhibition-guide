amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: sztu_nav_base
    odom_frame_id: sztu_nav_odom
    global_frame_id: map
    scan_topic: /sztu/scan
    set_initial_pose: false
    tf_broadcast: true
    transform_tolerance: 0.3
    update_min_d: 0.05
    update_min_a: 0.05
    laser_max_range: 15.0
    laser_min_range: 0.05
    laser_likelihood_max_dist: 2.0
    max_particles: 1500
    min_particles: 300
    robot_model_type: nav2_amcl::OmniMotionModel
    laser_model_type: likelihood_field

map_server:
  ros__parameters:
    yaml_filename: ''
    topic_name: /sztu/map
    frame_id: map

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.25
      use_astar: true
      # 本仓库所有地图 free 只占 18~24%，其余是建图未覆盖的 unknown。
      # Nav2 官方默认 true；设 false 会让规划器只能在已扫过的碎片区域里走。
      allow_unknown: true

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    controller_plugins: [FollowPath]
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.7
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_cost_regulated_linear_velocity_scaling: true
      inflation_cost_scaling_factor: 3.0
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_speed: 0.05
      min_approach_linear_velocity: 0.05
      allow_reversing: false

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: sztu_nav_base
    odom_topic: /sztu/nav_odom
    default_nav_to_pose_bt_xml: ''

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      global_frame: sztu_nav_odom
      robot_base_frame: sztu_nav_base
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.35
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        transform_tolerance: 1.0
        observation_sources: scan
        scan:
          topic: /sztu/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 8.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      global_frame: map
      robot_base_frame: sztu_nav_base
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: false
      robot_radius: 0.35
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /sztu/map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        transform_tolerance: 1.0
        observation_sources: scan
        scan:
          topic: /sztu/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 8.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

behavior_server:
  ros__parameters:
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    stop_on_failure: true
    loop_rate: 10

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    max_velocity: [0.25, 0.0, 0.7]
    min_velocity: [0.0, 0.0, -0.7]
    max_accel: [0.15, 0.0, 0.5]
    max_decel: [-0.25, 0.0, -0.7]
    velocity_timeout: 0.25
    feedback: OPEN_LOOP
    odom_topic: /sztu/nav_odom
    cmd_vel_in_topic: /cmd_vel_nav_raw
    cmd_vel_out_topic: /cmd_vel_nav
