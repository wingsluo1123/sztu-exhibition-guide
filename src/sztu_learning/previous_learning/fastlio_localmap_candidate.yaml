# 独立的局部地图窗口修正，由lesson38加载；lesson34保留原窗口作对照。
# 已做一次同包对照：200m窗口未观察到里程计，1000m窗口观察到输出。
# 这是候选时间假设下的数据链路证据，不是完整地图或位姿精度验证。
# 原实验默认cube_side_length=200、mapping.det_range=300、MOV_THRESHOLD=1.5：
# 窗口中心到边界100m <= 触发距离450m，中心也会触发移动。
# 先只改变窗口边长：1000/2=500m > 450m；其余参数保持原实验值。
# 1000m是维护窗口的几何边长，不是点云分辨率，不代表硬件量程或建图成果。
laser_mapping:
  ros__parameters:
    cube_side_length: 1000.0
