/lio/spark_fast_lio_node:
  ros__parameters:
    common:
      base_frame: ''
      imu_frame: imu_rectified
      lidar_frame: lidar_rectified
      map_frame: odom
      save_dir: /home/sztu/sztu/src/sztu_learning/agibot_x2_trial/maps/mapping01/pcd
      sequence_name: ''
      time_sync_en: false
      visualization_frame: imu
    cube_side_length: 1000.0
    extrinsics_timeout_s: 10.0
    filter_size_map: 0.1
    gravity_alignment:
      acc_diff_thr: 0.2
      enable_gravity_alignment: false
      g_base:
      - 0.0
      - 0.0
      - -1.0
      num_gravity_measurements_thr: 20
      num_moving_frames_thr: 20
    map_file_path: ''
    mapping:
      acc_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      det_range: 15.0
      extrinsic_R:
      - 0.9999533365735452
      - 0.0015116197042464592
      - 0.009541471652932842
      - -0.0013867988479434046
      - 0.9999135566296135
      - -0.01307501653046847
      - -0.009560411308585537
      - 0.013061174303500178
      - 0.999868993549367
      extrinsic_T:
      - 0.011211999692022802
      - -0.0157517995685339
      - 0.004274399951100343
      extrinsic_est_en: false
      fov_degree: 180.0
      gyr_cov: 0.1
    max_iteration: 4
    pcd_save:
      interval: 25
      pcd_save_en: false
    pcl_verbose: true
    point_filter_num: 4
    point_filter_num_for_preprocessing: 1
    preprocess:
      blind: 0.45
      blind_for_human_pilots: 0.0
      lidar_type: 2
      scan_line: 96
      scan_rate: 10
      timestamp_unit: 0
    publish:
      dense_publish_en: true
      path_en: true
      scan_baseframe_pub_en: false
      scan_bodyframe_pub_en: true
      scan_lidarframe_pub_en: true
      scan_publish_en: true
      tf_en: false
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf:
        publisher:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable
    runtime_pos_log_enable: false
    use_sim_time: true
    verbose: false

