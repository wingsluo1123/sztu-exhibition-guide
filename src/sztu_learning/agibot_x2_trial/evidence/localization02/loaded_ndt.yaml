/lidar_localization:
  ros__parameters:
    base_frame_id: base_link
    enable_debug: true
    enable_map_odom_tf: true
    enable_timer_publishing: false
    global_frame_id: map
    initial_pose_qw: 0.9990470858172356
    initial_pose_qx: 0.000417571700164049
    initial_pose_qy: 0.043398228942698396
    initial_pose_qz: 0.004619488997878014
    initial_pose_x: -0.11924952870873211
    initial_pose_y: -0.017831043777753214
    initial_pose_z: 0.684609260403247
